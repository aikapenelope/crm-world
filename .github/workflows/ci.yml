# CI — Aika Platform
#
# Corre en cada PR hacia main y en cada push a main.
# Dos jobs en paralelo: typecheck y lint.
#
# typecheck: yarn generate (descubre módulos) → yarn typecheck (tsc --noEmit)
# lint:      yarn lint (ESLint)
#
# NOTA: --immutable eliminado. En Yarn 4, --immutable trata YN0086 (peer dep
# warnings) como error fatal, lo que bloquea el install aunque las dependencias
# estén correctamente instaladas. Yarn 4 sin --immutable sigue respetando
# el lockfile en CI (no modifica yarn.lock si no hay cambios).
#
# El audit de seguridad (yarn npm audit) está deliberadamente excluido del CI
# de PR para no bloquear trabajo por CVEs en dependencias transitivas que no
# controlamos. Se puede correr manualmente con: yarn npm audit --severity high

name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancela runs en curso del mismo ref al hacer push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── TypeScript ─────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache .yarn/cache
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: Generate module glue
        run: yarn generate

      - name: Typecheck
        run: yarn typecheck

  # ── ESLint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache .yarn/cache
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: Lint
        run: yarn lint
