# CI — crm-world (Standalone Open Mercato Application)
#
# Four parallel jobs on every PR to main and every push to main.
#
# ┌─────────────┬──────────────────────────────────────────────────────────┐
# │ Job         │ What it validates                                         │
# ├─────────────┼──────────────────────────────────────────────────────────┤
# │ lint        │ ESLint on src/modules (pure TypeScript business logic)    │
# │ typecheck   │ tsc --noEmit on all production code (*.ts + *.tsx)       │
# │ test        │ Jest unit tests (src/modules/**/__tests__/**/*.spec.ts)   │
# │ build       │ next build completo — detecta roturas de Turbopack/bundler│
# └─────────────┴──────────────────────────────────────────────────────────┘
#
# Design notes
# ────────────
# • All three jobs share the same yarn/node_modules cache key.
#   The first runner to install saves the cache; subsequent runners reuse it.
#
# • yarn install runs without --immutable.
#   Yarn 4 auto-enables "hardened mode" (≡ --immutable) for public-repo PRs.
#   YN0086 peer-dep warnings are non-fatal without the flag; the lockfile is
#   still fully respected (Yarn never changes it without explicit install).
#
# • typecheck uses NODE_OPTIONS=--max-old-space-size=6144.
#   The project has 111+ modules; tsc exhausts the default Node heap (~1.5 GB)
#   on ubuntu-latest (7 GB total RAM). 6 GB gives headroom without OOM.
#
# • yarn generate runs before typecheck.
#   mercato generate writes .mercato/generated/*.ts files that tsconfig.json
#   includes. Without them, tsc reports "Cannot find module '#generated/...'".
#
# • lint scope: src/modules only (not the full Next.js app).
#   The Open Mercato monorepo CI does the same: it excludes @open-mercato/app
#   from the lint turbo filter. Reason: eslint-config-next + ESLint v10 flat
#   config triggers scopeManager.addGlobals errors on React component files.
#   App-layer lint runs locally via IDE / pre-commit hooks.
#
# • Security audit (yarn npm audit) is intentionally excluded from PR CI to
#   avoid blocking work on CVEs in transitive dependencies we do not control.
#   Run manually: yarn npm audit --severity high
#
# • build job runs yarn generate + next build (Turbopack production build).
#   Uses a minimal .env (dummy values) so Next.js can complete the build without
#   a real database. TypeScript errors are suppressed (typescript.ignoreBuildErrors
#   = true in next.config.ts) since typecheck validates TS separately.
#   NODE_OPTIONS=--max-old-space-size=4096 matches the production Docker limit.
#
# References
# ──────────
# open-mercato/open-mercato .github/workflows/ci.yml
# open-mercato/open-mercato apps/mercato/jest.config.cjs

name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same ref when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─── Shared setup ─────────────────────────────────────────────────────────────
# All three jobs use the same Node version and Yarn cache strategy.
# Extracted as workflow-level defaults to avoid repetition.

defaults:
  run:
    shell: bash

jobs:

  # ── Lint ────────────────────────────────────────────────────────────────────
  # Fast static analysis on pure TypeScript module code.
  # Does NOT need yarn generate — eslint does not type-check, only lints.
  # Fails fast before the heavier typecheck and test jobs consume minutes.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: Lint
        run: yarn lint

  # ── Typecheck ───────────────────────────────────────────────────────────────
  # Full tsc --noEmit on all production code (*.ts + *.tsx).
  # Test files (__tests__/**/*.spec.ts) are excluded via tsconfig.json so
  # ts-jest compiles them independently with CJS-compatible settings.
  #
  # yarn generate runs first — it writes .mercato/generated/*.ts which
  # tsconfig.json includes. Skipping it causes spurious "module not found" errors.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # Raise the Node heap to 6 GB so tsc can analyse 111+ modules without OOM.
    # ubuntu-latest has 7 GB RAM; 6 GB leaves enough for the runner itself.
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: Generate module glue
        # Writes .mercato/generated/modules.generated.ts and related type files.
        # Required before tsc so all #generated/* imports resolve.
        run: yarn generate

      - name: Typecheck
        run: yarn typecheck

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  # Jest unit tests: src/modules/**/__tests__/**/*.spec.ts
  #
  # Tests are pure — no database, no HTTP, no framework dependencies.
  # Each module's data/validators.ts is tested with Zod safeParse assertions.
  # MikroORM entities in test context are handled by jest-mikroorm-transformer
  # (sanitises import.meta.* → CJS stubs, then delegates to ts-jest).
  #
  # --ci        disables watch mode and fails on snapshots that need updating.
  # --forceExit closes Jest after all tests finish (guards against open handles
  #             from MikroORM optional-dep discovery at import time).
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: Unit Tests
        run: yarn test --ci --forceExit

      - name: Coverage summary (informational)
        # Produces a coverage report but does NOT fail on thresholds.
        # The suite grows incrementally alongside modules — thresholds activate
        # once there is sufficient coverage across all verticals.
        if: always()
        run: |
          yarn test --ci --forceExit --coverage \
            --coverageReporters=json-summary 2>/dev/null || true
        continue-on-error: true

      - name: Publish coverage to Step Summary
        if: always()
        run: |
          SUMMARY="coverage/coverage-summary.json"
          [ -f "$SUMMARY" ] || exit 0
          node -e "
          const fs = require('fs')
          const s = JSON.parse(fs.readFileSync('$SUMMARY', 'utf8')).total || {}
          const row = (k) => {
            const m = s[k] || {}
            return '| ' + k + ' | ' + (m.covered??0) + '/' + (m.total??0) + ' | ' + (m.pct??0) + '% |'
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Unit Test Coverage', '',
            '| Metric | Covered/Total | % |',
            '|---|---:|---:|',
            row('lines'), row('statements'), row('functions'), row('branches'), '',
          ].join('\n'))
          "

  # ── Build ────────────────────────────────────────────────────────────────────
  # Full Next.js production build (yarn generate + next build via Turbopack).
  # Catches bundler/import errors that tsc --noEmit misses (e.g. Turbopack
  # "Module not found" for JSON imports, new URL() patterns, missing lib proxies).
  #
  # Uses a minimal .env with dummy values so Next.js can build without a real
  # database. TypeScript errors are intentionally ignored (typescript.ignoreBuildErrors
  # = true in next.config.ts) — type validation is the typecheck job's responsibility.
  #
  # NODE_OPTIONS=--max-old-space-size=4096 mirrors the production Docker container
  # limit so OOM failures in CI predict production behaviour accurately.
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: Create minimal .env for build
        # Provides dummy values required by next.config.ts and the generator.
        # No real database is needed — the build only compiles pages, not data.
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgres://postgres:ci@localhost:5432/ci-build
          JWT_SECRET=ci-jwt-secret-not-real
          APP_URL=https://ci.example.com
          NEXT_TELEMETRY_DISABLED=1
          TENANT_DATA_ENCRYPTION=false
          OM_SEARCH_ENABLED=false
          OM_DISABLE_VECTOR_SEARCH_AUTOINDEXING=true
          AUTO_SPAWN_WORKERS=false
          EOF

      - name: Build
        # yarn build = yarn generate + next build
        # typescript.ignoreBuildErrors=true in next.config.ts → TS errors don't fail
        # Turbopack/bundler errors (missing modules, bad imports) DO fail the build
        run: yarn build

  # ── API Smoke Tests ──────────────────────────────────────────────────────────
  # Verifica que todos los módulos custom responden en sus endpoints principales.
  # Usa TC-SMOKE-001-module-health.spec.ts (62 módulos, API-only).
  #
  # Por qué NO usa test:integration:ephemeral:
  #   test:integration:ephemeral usa yarn initialize → mercato init → db:migrate.
  #   db:migrate requiere migration files commiteados por módulo. Los 111 módulos
  #   custom de crm-world no tienen migrations commiteadas aún (ver Phase 36 en
  #   docs/ROADMAP.md). Sin ellas, db:migrate no crea las tablas custom →
  #   payment_methods/setup.ts seedDefaults falla con "relation does not exist".
  #
  # Por qué usa GitHub services + db:greenfield:
  #   db:greenfield (packages/cli/src/lib/db/commands.ts:553-561) genera y aplica
  #   migrations ON-THE-FLY desde los entity schemas. No requiere migration files
  #   pre-commiteados. Es la forma documentada de OM para testing en entornos
  #   donde no existen migrations: genera → aplica → inicializa → testea.
  #   Referencia: open-mercato packages/cli/src/lib/db/commands.ts "Greenfield reset"
  #
  # Esto es equivalente en aislamiento a test:integration:ephemeral:
  #   - Base de datos fresca por cada run (no contamina producción)
  #   - Redis y Meilisearch aislados
  #   - El app arranca contra la DB efímera
  #
  # Este job es non-blocking (continue-on-error: true) mientras el smoke suite
  # se estabiliza. Eliminar continue-on-error cuando todos los módulos pasen.
  smoke:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: [build]           # Solo corre si build pasa
    continue-on-error: true  # Non-blocking mientras el suite se estabiliza

    # ── Servicios de infraestructura aislada ────────────────────────────────
    # Equivalente a testcontainers pero usando GitHub Actions native services,
    # más estable en CI y sin overhead de Docker-in-Docker.
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-smoke
          POSTGRES_DB: crm-smoke
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-smoke-key
          MEILI_NO_ANALYTICS: "true"
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 7700:7700

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgres://postgres:ci-smoke@localhost:5432/crm-smoke
      CACHE_REDIS_URL: redis://localhost:6379
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: ci-smoke-key
      MEILISEARCH_MASTER_KEY: ci-smoke-key
      JWT_SECRET: ci-smoke-jwt-secret-not-real
      APP_URL: http://localhost:3000
      TENANT_DATA_ENCRYPTION: "false"
      OM_SEARCH_ENABLED: "false"
      OM_DISABLE_VECTOR_SEARCH_AUTOINDEXING: "true"
      AUTO_SPAWN_WORKERS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate module registry
        # Escribe .mercato/generated/*.ts — necesario para db:greenfield y el servidor
        run: yarn generate

      - name: Setup database with greenfield
        # db:greenfield genera migrations desde los entity schemas Y las aplica.
        # Esto crea las tablas de todos los módulos (core + custom) sin necesitar
        # migration files pre-commiteados.
        # Referencia: open-mercato packages/cli/src/lib/db/commands.ts:553-561
        run: yarn db:greenfield

      - name: Initialize app data
        # Crea superadmin + primer tenant + seedDefaults de todos los módulos.
        # Ahora que db:greenfield creó las tablas, esta operación no falla.
        run: yarn initialize

      - name: Build production app
        # Build necesario para yarn start (Next.js production server).
        # typescript.ignoreBuildErrors=true — TS se valida en el job Typecheck.
        run: yarn build

      - name: Start app in background
        run: |
          yarn start &
          echo "APP_PID=$!" >> $GITHUB_ENV

      - name: Wait for app to be ready
        # Espera hasta 90s a que el servidor de Next.js responda en /login.
        run: |
          npx wait-on http://localhost:3000/login --timeout 90000 --interval 2000
          echo "App is ready"

      - name: Run API Smoke Tests
        # BASE_URL apunta al servidor local levantado con yarn start.
        # yarn test:integration = npx playwright test --config .ai/qa/tests/playwright.config.ts
        # --filter TC-SMOKE-001 limita a los specs de health check de módulos.
        run: |
          BASE_URL=http://localhost:3000 yarn test:integration TC-SMOKE-001

      - name: Stop app
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then kill "$APP_PID" 2>/dev/null || true; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results-${{ github.run_number }}
          path: |
            .ai/qa/test-results/
          retention-days: 7

      - name: Publish smoke test summary
        if: always()
        run: |
          RESULTS=".ai/qa/test-results/results.json"
          [ -f "$RESULTS" ] || exit 0
          node -e "
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync('$RESULTS', 'utf8'))
          const total = r.stats?.expected ?? 0
          const passed = r.stats?.expected - (r.stats?.unexpected ?? 0)
          const failed = r.stats?.unexpected ?? 0
          const lines = [
            '## API Smoke Test Results', '',
            '| Metric | Count |',
            '|--------|-------|',
            \`| Total modules tested | \${total} |\`,
            \`| ✅ Passed | \${passed} |\`,
            \`| ❌ Failed | \${failed} |\`,
            '',
          ]
          if (r.suites) {
            const failures = []
            function collectFailed(suites) {
              for (const s of suites || []) {
                for (const spec of s.specs || []) {
                  for (const test of spec.tests || []) {
                    if (test.status !== 'expected') {
                      const err = test.results?.[0]?.errors?.[0]?.message ?? 'unknown error'
                      failures.push(\`| \${spec.title} | \${err.substring(0, 200)} |\`)
                    }
                  }
                }
                collectFailed(s.suites)
              }
            }
            collectFailed(r.suites)
            if (failures.length > 0) {
              lines.push('### Failed Modules', '', '| Test | Error |', '|------|-------|', ...failures, '')
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'))
          "


